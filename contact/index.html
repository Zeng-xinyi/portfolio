<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - XinYi Zeng</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Contact Me</h1>
    <!--Calling the local mail client-->
    <form action="mailto:zengxinyi04@gmail.com"  method="POST" enctype="text/plain">
        <label>
            Email:
            <input type="email" name="email" required>
        </label>

        <label>
            Subject:
            <input name="subject" required>
        </label>

        <label>
            Message:
            <textarea name="body" rows="3" required></textarea>
        </label>

        <button>Send</button>
    </form>


<script type="module" src="../global.js"></script>
</body>
</html>
